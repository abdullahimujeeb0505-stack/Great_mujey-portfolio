<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multi-Timezone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Global Time Clock</h1>
            <p class="subtitle">Current time across the world</p>
        </header>

        <div class="clocks-grid" id="clocksGrid">
            <!-- Clock cards will be generated here by JavaScript -->
        </div>

        <footer>
            <p>Updates automatically every second</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
